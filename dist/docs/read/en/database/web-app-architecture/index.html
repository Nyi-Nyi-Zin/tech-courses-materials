  <meta name="description" content="When a user accesses a web application, the browser retrieves and executes the frontend files from the Web Server. As the user interacts with the application—such as viewing data—the frontend initiates an API request. This request is sent to the backend over HTTPS, and the backend processes it to return a response. If the user uploads a file (e.g., a PDF), the backend stores the physical file in a shared folder on a Samba File Server and saves only the file&#39;s path in the database alongside the relevant record.">
